---
- name: Create AWX test directory and file
  hosts: all
  gather_facts: false

  tasks:
    - name: Create test directory
      ansible.builtin.file:
        path: /tmp/awx-lab
        state: directory
        mode: '0755'

    - name: Create hello file
      ansible.builtin.copy:
        content: "Hello from AWX and Ansible!\n"
        dest: /tmp/awx-lab/hello.txt
        mode: '0644'
